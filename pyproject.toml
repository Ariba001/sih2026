[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "burnin-anomaly-detection"
version = "2.0.0"
description = "AI-Driven Anomaly Detection in Component Burn-In & Screening for MIL-STD-883 Aerospace Qualification"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Ariba Siddiqui", email = "ariba.siddiqui001@gmail.com"}
]
keywords = ["burn-in", "anomaly-detection", "semiconductor", "aerospace", "mil-std-883"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "numpy>=1.21.0,<2.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "xgboost>=1.5.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "streamlit>=1.20.0",
    "pydantic>=1.9.0",
    "joblib>=1.1.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "lifelines>=0.28.0",
    "plotly>=5.0.0",
    "python-multipart>=0.0.5",
    "aiofiles>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "isort>=5.10.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
shap = [
    "shap>=0.42.0",
]

[project.urls]
Homepage = "https://github.com/viasalusproducts/SIH-26170-burnin-anomaly-detection"
Repository = "https://github.com/viasalusproducts/SIH-26170-burnin-anomaly-detection.git"
Documentation = "https://github.com/viasalusproducts/SIH-26170-burnin-anomaly-detection#readme"
"Bug Tracker" = "https://github.com/viasalusproducts/SIH-26170-burnin-anomaly-detection/issues"

[tool.black]
line-length = 100
target-version = ["py39"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
